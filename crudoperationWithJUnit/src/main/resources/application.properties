# Name of the Spring Boot application
spring.application.name=crudoperation

# MySQL database connection URL
# localhost = MySQL is running on your computer
# 3306 = default MySQL port
# zentiqdb = name of your database
spring.datasource.url=jdbc:mysql://localhost:3306/zentiqdb

# MySQL username
spring.datasource.username=root

# MySQL password
spring.datasource.password=zentiq

# Automatically update database tables according to your Entity classes
# "update" keeps existing data and updates the table structure when needed
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console
spring.jpa.show-sql=true

# Format SQL queries to make them easier to read
spring.jpa.properties.hibernate.format_sql=true


